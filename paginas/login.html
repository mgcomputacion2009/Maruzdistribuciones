 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Maruz Distributions Corp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <!-- Company Logo -->
        <img src="{{ url_for('static', filename='images/maruz-logo.png') }}" 
             alt="Maruz Distributions Corp Logo" 
             class="company-logo"
             onerror="this.style.display='none'">
        
        <!-- Login Title -->
        <h1 class="login-title">Welcome back</h1>
        <p class="login-subtitle">Sign in to your account to continue</p>
        
        <!-- Login Form -->
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="email" class="form-label">Email address</label>
                <input type="email" 
                       id="email" 
                       class="form-input" 
                       placeholder="Enter your email"
                       required>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" 
                       id="password" 
                       class="form-input" 
                       placeholder="Enter your password"
                       required>
            </div>
            
            <button type="submit" class="login-button">
                <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i>
                Sign In
            </button>
        </form>
        
        <!-- Divider -->
        <div class="divider">or continue with</div>
        
        <!-- Social Login Buttons -->
        <div class="social-buttons">
            <button class="social-button google-button">
                <i class="fab fa-google"></i>
                Continue with Google
            </button>
            
            <button class="social-button apple-button">
                <i class="fab fa-apple"></i>
                Continue with Apple
            </button>
            
            <button class="social-button facebook-button">
                <i class="fab fa-facebook-f"></i>
                Continue with Facebook
            </button>
        </div>
    </div>
    
    <!-- Development Modal -->
    <div id="developmentModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            
            <div class="modal-icon">
                <i class="fas fa-cog loading-gear"></i>
            </div>
            
            <h2 class="modal-title">Under Development</h2>
            <p class="modal-text">
                We are currently working on this feature. 
                Our development team is building something amazing for you. 
                Please check back soon!
            </p>
            
            <button class="modal-button">Got it</button>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
