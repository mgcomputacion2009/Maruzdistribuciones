server {
    listen 80;
    server_name localhost;  # Cambia esto por tu dominio si tienes uno
    
    # Directorio raíz para archivos estáticos
    root /var/www/maruz;
    
    # Logs
    access_log /var/log/nginx/maruz_access.log;
    error_log /var/log/nginx/maruz_error.log;
    
    # Configuración para archivos estáticos
    location /static {
        alias /var/www/maruz/static;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location /public {
        alias /var/www/maruz/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Proxy hacia Gunicorn para la aplicación Flask
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_busy_buffers_size 16k;
    }
    
    # Seguridad adicional
    location ~ /\. {
        deny all;
    }
    
    location ~ ~$ {
        deny all;
    }
}
